<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="VetCore ERP - IntegraSoft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <!-- decorative paws -->
  <g fill="#ffffff" opacity="0.08">
    <g transform="translate(980 40) rotate(15) scale(2.4)">
      <ellipse cx="30" cy="62" rx="22" ry="18"/><ellipse cx="8" cy="34" rx="8" ry="11"/><ellipse cx="26" cy="20" rx="8" ry="11"/><ellipse cx="46" cy="20" rx="8" ry="11"/><ellipse cx="62" cy="34" rx="8" ry="11"/>
    </g>
    <g transform="translate(820 190) rotate(-20) scale(1.4)">
      <ellipse cx="30" cy="62" rx="22" ry="18"/><ellipse cx="8" cy="34" rx="8" ry="11"/><ellipse cx="26" cy="20" rx="8" ry="11"/><ellipse cx="46" cy="20" rx="8" ry="11"/><ellipse cx="62" cy="34" rx="8" ry="11"/>
    </g>
  </g>
  <!-- logo: medical cross inside circle -->
  <circle cx="150" cy="160" r="82" fill="#ffffff" opacity="0.14"/>
  <circle cx="150" cy="160" r="64" fill="#ffffff"/>
  <rect x="136" y="124" width="28" height="72" rx="6" fill="#0f766e"/>
  <rect x="114" y="146" width="72" height="28" rx="6" fill="#0f766e"/>
  <!-- text -->
  <text x="280" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#accent)">VetCore ERP</text>
  <text x="284" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#ccfbf1">Gestión integral para clínicas veterinarias</text>
  <text x="284" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#99f6e4">INTEGRASOFT  ·  PROYECTO ACADÉMICO</text>
</svg>
